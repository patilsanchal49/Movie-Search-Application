<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie & Show Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <p class="eyebrow">DISCOVER SOMETHING TO WATCH</p>
    <h1>Movie &amp; Show Search</h1>
    <p>Search TVMaze's free catalogue and build your watchlist.</p>
  </header>
  <main class="container">
    <form id="search-form" class="search-form">
      <label class="sr-only" for="search-input">Search for a movie or show</label>
      <input id="search-input" type="search" placeholder="Try “Friends” or “The Office”" required />
      <button type="submit">Search</button>
    </form>
    <p id="status" role="status" aria-live="polite">Search for a title to get started.</p>
    <section>
      <div class="section-heading"><h2>Search results</h2><span id="result-count">0 results</span></div>
      <div id="results" class="movie-grid"></div>
    </section>
    <section class="watchlist-section">
      <div class="section-heading"><h2>Your watchlist</h2><span id="watchlist-count">0 saved</span></div>
      <div id="watchlist" class="movie-grid"></div>
    </section>
  </main>
  <footer>Data provided by <a href="https://www.tvmaze.com/api" target="_blank" rel="noreferrer">TVMaze API</a>.</footer>
  <script src="script.js"></script>
</body>
</html>
